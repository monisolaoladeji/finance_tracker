{% extends "base.html" %}

{% block title %}Sign Up | Finance Tracker{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="card auth-card">
        <div class="card-head">
            <h2>Create Account</h2>
            <p class="muted">Start tracking your expenses today.</p>
        </div>
        <form class="form" method="post" action="{{ url_for('signup') }}">
            <label class="field">
                <span>Username</span>
                <input name="username" required autofocus placeholder="At least 3 characters">
            </label>
            <label class="field">
                <span>Password</span>
                <input name="password" type="password" required placeholder="At least 6 characters">
            </label>
            <button class="btn btn-primary btn-full" type="submit">Sign Up</button>
        </form>
        <div class="auth-footer">
            <p class="muted">Already have an account? <a href="{{ url_for('login_page') }}">Login</a></p>
        </div>
    </div>
</div>
{% endblock %}
